<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Schedule Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 text-gray-900 flex flex-col">

  <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <h1 class="text-lg font-semibold">Student Schedule Manager</h1>
    <span id="header-date" class="text-sm text-gray-500"></span>
  </header>

  <nav class="bg-white border-b border-gray-200 flex">
    <button type="button" data-view="todo" class="nav-tab flex-1 py-3 text-sm font-medium text-center border-b-2 border-blue-600 text-blue-600">
      To-Do
    </button>
    <button type="button" data-view="calendar" class="nav-tab flex-1 py-3 text-sm font-medium text-center border-b-2 border-transparent text-gray-500">
      Calendar
    </button>
  </nav>

  <main class="flex-1 p-4">

    <section id="todo-view" class="view">
      <ul id="todo-list" class="space-y-2 mb-4">
        <li class="bg-white rounded-lg border border-gray-200 p-3 text-sm text-gray-400 text-center">
          No to-do items yet.
        </li>
      </ul>

      <form id="todo-form" class="flex gap-2">
        <input
          type="text"
          id="todo-input"
          placeholder="Add a to-do item"
          class="flex-1 rounded-lg border border-gray-300 px-3 py-2 text-sm"
        />
        <button
          type="submit"
          class="rounded-lg bg-blue-600 text-white text-sm font-medium px-4 py-2"
        >
          Add
        </button>
      </form>
    </section>

    <section id="calendar-view" class="view hidden">
      <div class="bg-white rounded-lg border border-gray-200 p-3 mb-3">
        <p id="calendar-today" class="text-sm font-medium"></p>
      </div>
      <div class="bg-white rounded-lg border border-gray-200 p-3 text-sm text-gray-400 text-center">
        No events yet.
      </div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
